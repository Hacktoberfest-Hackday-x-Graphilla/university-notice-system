<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Notice Chat</title>
  <style>
    :root { --ink: #1f2933; --muted: #6b7280; --accent: #2563eb; --danger: #dc2626; --bg: #f8fafc; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink);
      max-width: 760px; margin: 0 auto; padding: 24px 12px;
    }
    header h1 { margin: 0 0 4px; font-size: 1.25rem; }
    header p { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
    header a { color: var(--accent); }
    code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .panel h2 { margin: 0 0 12px; font-size: 1rem; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row input[type="password"] { max-width: 160px; }
    .row input[type="file"] { max-width: 240px; }
    input { padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 0.9rem; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 8px 14px; font-size: 0.9rem; cursor: pointer;
    }
    button.danger { background: var(--danger); }
    button:disabled { opacity: 0.6; cursor: default; }
    .status { color: var(--muted); font-size: 0.85rem; min-height: 1.2em; margin-top: 8px; }
    .status.err { color: var(--danger); }
    #fileList { margin: 0; padding-left: 20px; }
    #fileList li { margin: 4px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Admin - Notice Chat</h1>
    <p>Upload the notice PDFs people will ask about. The admin password comes from <code>.env</code>. <a href="/">Back to the chat</a></p>
  </header>

  <section class="panel">
    <h2>Upload a notice PDF</h2>
    <div class="row">
      <input type="password" id="adminKey" placeholder="Admin password" autocomplete="off">
      <input type="file" id="file" accept=".pdf">
      <button id="uploadBtn">Upload</button>
    </div>
    <p class="status" id="uploadStatus"></p>
  </section>

  <section class="panel">
    <h2>Loaded documents</h2>
    <ul id="fileList"><li>Loading...</li></ul>
    <div class="row" style="margin-top:12px">
      <button id="resetBtn" class="danger">Forget all documents</button>
      <span class="status" id="resetStatus"></span>
    </div>
  </section>

  <script>
    const uploadStatus = document.getElementById("uploadStatus");
    const fileList = document.getElementById("fileList");
    const resetStatus = document.getElementById("resetStatus");

    function setStatus(el, text, isError) {
      el.textContent = text;
      el.classList.toggle("err", !!isError);
    }

    async function loadFiles() {
      try {
        const res = await fetch("/api/files");
        const data = await res.json();
        if (!data.files || !data.files.length) {
          fileList.innerHTML = "<li>No documents uploaded yet.</li>";
        } else {
          fileList.innerHTML = "";
          for (const name of data.files) {
            const li = document.createElement("li");
            li.textContent = name;
            fileList.appendChild(li);
          }
        }
      } catch (err) {
        fileList.innerHTML = "<li>Could not load documents.</li>";
      }
    }

    async function uploadFile() {
      const input = document.getElementById("file");
      const file = input.files && input.files[0];
      const password = document.getElementById("adminKey").value;
      if (!file) { setStatus(uploadStatus, "Pick a PDF first.", true); return; }
      const form = new FormData();
      form.append("file", file);
      setStatus(uploadStatus, "Uploading " + file.name + " ...");
      try {
        const res = await fetch("/api/upload", {
          method: "POST",
          body: form,
          headers: { "X-Admin-Password": password }
        });
        const data = await res.json();
        if (res.status === 401) {
          setStatus(uploadStatus, "Wrong or missing admin password.", true);
        } else if (!data.ok) {
          setStatus(uploadStatus, "Error: " + (data.error || "upload failed"), true);
        } else {
          setStatus(uploadStatus, "Stored " + data.file + " (" + data.chunks + " chunks).");
          document.getElementById("file").value = "";
          await loadFiles();
        }
      } catch (err) {
        setStatus(uploadStatus, "Error: " + err, true);
      }
    }

    async function resetAll() {
      const password = document.getElementById("adminKey").value;
      if (!confirm("Forget ALL uploaded documents? This cannot be undone.")) return;
      setStatus(resetStatus, "Resetting...");
      try {
        const res = await fetch("/api/reset", {
          method: "POST",
          headers: { "X-Admin-Password": password }
        });
        const data = await res.json();
        if (res.status === 401) {
          setStatus(resetStatus, "Wrong or missing admin password.", true);
        } else if (!data.ok) {
          setStatus(resetStatus, "Error: " + (data.error || "reset failed"), true);
        } else {
          setStatus(resetStatus, "All documents forgotten.");
          await loadFiles();
        }
      } catch (err) {
        setStatus(resetStatus, "Error: " + err, true);
      }
    }

    document.getElementById("uploadBtn").addEventListener("click", uploadFile);
    document.getElementById("resetBtn").addEventListener("click", resetAll);
    document.getElementById("adminKey").addEventListener("keydown", (e) => {
      if (e.key === "Enter") uploadFile();
    });

    loadFiles();
  </script>
</body>
</html>
